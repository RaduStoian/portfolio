name: Deploy

on:
  push:
    branches:
      - master

concurrency:
  group: stoianworks-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Configure SSH
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh

        printf '%s' "${{ secrets.DEPLOY_SSH_KEY }}" \
          | base64 --decode \
          | tr -d '\r' \
          > ~/.ssh/deploy_key

        printf '\n' >> ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key

        echo "Key header:"
        head -n 1 ~/.ssh/deploy_key

        echo "Key footer:"
        tail -n 1 ~/.ssh/deploy_key

        echo "Validating private key..."
        ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

        ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

    - name: Deploy
      run: |
        ssh \
          -i ~/.ssh/deploy_key \
          -o IdentitiesOnly=yes \
          root@"${{ secrets.DEPLOY_HOST }}"
